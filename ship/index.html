<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lục Trà Thăng Hoa Bến Cát</title>
<link rel="icon" href="/luctrathanghoa/icons/icon-32.png">
<link rel="apple-touch-icon" href="/luctrathanghoa/icons/icon-180.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #0a2b5e;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  a { color: #0b4fae; font-weight: 600; }
</style>
</head>
<body>
<div>
  <img src="/luctrathanghoa/icons/icon-180.png" alt="">
  <p>Đang mở ứng dụng…</p>
  <p><a id="go" href="#">Bấm vào đây nếu trang không tự mở</a></p>
</div>
<script>
  /* ====== Link /exec của Web App TÀI KHOẢN MỚI (Triển khai → Quản lý bản triển khai → URL ứng dụng web) ====== */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzFvR2Ff1uJGufjFMISDWKmET_AY099fe8NGxLclOeiGgcpWdbM_lKLgZmz8E_Z98s2TA/exec';
  /* ============================================================================================================ */
  (function () {
    // Mở thẳng từng hệ thống: …/luctrathanghoa/ketca | /ship | /nhansu  (hoặc ?app=ketca …)
    var APPS = { ketca: 'ketca', ship: 'ship', nhansu: 'nhansu' };
    var seg = location.pathname.replace(/\/+$/, '').split('/').pop().toLowerCase();
    var q = new URLSearchParams(location.search).get('app');
    var app = APPS[(q || '').toLowerCase()] || APPS[seg] || '';
    var target = APP_URL + (app ? '?app=' + app : '');
    document.getElementById('go').href = target;
    location.replace(target);
  })();
</script>
</body>
</html>
